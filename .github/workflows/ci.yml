name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble production and test debug APKs
        run: ./gradlew assembleProdDebug assembleQaDebug

      - name: Run production and test unit tests
        run: ./gradlew testProdDebugUnitTest testQaDebugUnitTest

      - name: Run production and test lint
        run: ./gradlew lintProdDebug lintQaDebug
